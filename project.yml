name: WallConnectorLog
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
# keeps Xcode's "update to recommended settings" triangle away - changes made in
# its dialog land in the generated project and are lost on the next xcodegen run
attributes:
  LastUpgradeCheck: "2660"
settings:
  base:
    DEVELOPMENT_TEAM: 4S9Z57Q8KR
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  WallConnectorLog:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.mews.wallconnectorlog
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: WallConnectorLog
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_STYLE: Automatic
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: WallConnectorLog reads charging data from your WallConnectorLog server on the local network.
