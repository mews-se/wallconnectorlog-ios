name: WallConnectorLog
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
# keeps Xcode's "update to recommended settings" triangle away - changes made in
# its dialog land in the generated project and are lost on the next xcodegen run
attributes:
  LastUpgradeCheck: "2660"
settings:
  base:
    DEVELOPMENT_TEAM: 4S9Z57Q8KR
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  WallConnectorLog:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.mews.wallconnectorlog
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: WallConnectorLog
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_STYLE: Automatic
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: WallConnectorLog reads charging data from your WallConnectorLog server on the local network.
    entitlements:
      path: Resources/WallConnectorLog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.se.mews.wallconnectorlog
    dependencies:
      - target: WallConnectorLogWidget
        embed: true
  # The home-screen widget shares the models, the API client, the formatting
  # and the demo with the app; the server address reaches it through the group.
  WallConnectorLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Sources/Models.swift
      - Sources/APIClient.swift
      - Sources/Format.swift
      - Sources/Demo.swift
      - Sources/WidgetBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.mews.wallconnectorlog.widget
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Widget/Info.plist
      properties:
        # App Store validation wants the display name inside an extension's own
        # Info.plist; the INFOPLIST_KEY setting is not written into a plist file.
        CFBundleDisplayName: WallConnectorLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Widget/WallConnectorLogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.se.mews.wallconnectorlog
